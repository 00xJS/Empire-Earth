# DXVK-macOS knobs for Empire Earth (dgVoodoo D3D7 → D3D11).
# Native dxgi.dll must sit next to d3d11.dll in the game folder.

# Create the swapchain immediately so the opening screen can present.
# Deferred creation left Empire Earth frozen on the first splash blit.
dxgi.deferSurfaceCreation = False
dxgi.syncInterval = 0
dxgi.maxFrameRate = 60
# Flip/exclusive fullscreen on Wine/MoltenVK locked a 1x1 surface.
# Wine 11 win32u overwrites Vulkan currentExtent from HWND GetClientRect;
# ee-vkfix grows tiny HWNDs to 800x600 so DXVK does not present 1x1.
dxgi.tearFree = False
d3d11.relaxedBarriers = True
